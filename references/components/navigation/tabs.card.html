<div id="root" style="padding:20px;font-family:'Nunito Sans',sans-serif;background:var(--color-bg-page)"></div>
<script type="text/babel">
const { Tabs } = window.OctopusDesignSystem_492d91;
function Demo(){
  const items=['2022-03-01','2022-03-02','2022-07-08','2022-08-27'];
  const [active,setActive]=React.useState(items[0]);
  return <Tabs items={items} active={active} onChange={setActive} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
